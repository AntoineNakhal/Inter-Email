# Alembic configuration for the Knowledge Base database.
# This file is intentionally minimal — `init_kb_database()` overrides
# script_location and sqlalchemy.url programmatically. We keep it on disk
# only so `alembic -c backend/knowledge/alembic.ini ...` works for ad-hoc
# CLI use (creating revisions, downgrading manually, etc.).

[alembic]
script_location = .
sqlalchemy.url = postgresql+psycopg://kb:kb@localhost:5433/inter_kb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
