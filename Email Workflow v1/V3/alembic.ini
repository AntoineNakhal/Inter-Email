# Alembic configuration — run from the project root.
# Usage:
#   alembic upgrade head          # apply all pending migrations
#   alembic downgrade -1          # roll back one migration
#   alembic revision --autogenerate -m "add_foo_column"  # generate new migration

[alembic]
# Path to the migrations folder, relative to this file (project root).
script_location = backend/persistence/migrations

# Add the project root to sys.path so `backend.*` imports resolve.
prepend_sys_path = .

# Version files separator.
version_path_separator = os

# sqlalchemy.url is overridden at runtime by env.py using the DATABASE_URL
# environment variable. This value is only used as a fallback when the env
# var is not set (e.g. running `alembic` without a .env loaded).
sqlalchemy.url = sqlite:///./data/sqlite/app.db

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
