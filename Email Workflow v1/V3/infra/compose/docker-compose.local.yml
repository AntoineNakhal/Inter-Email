services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: interemailv3
      POSTGRES_PASSWORD: interemailv3
      POSTGRES_DB: interemailv3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interemailv3"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate Postgres for the Knowledge Base (RAG corpus + embeddings).
  # Kept isolated from the main app DB so:
  #   * its lifecycle (dump, wipe, re-ingest) doesn't touch user/email data
  #   * pgvector + heavy similarity scans don't share IO with the hot OLTP path
  #   * we can scale or move the KB later without a coordinated migration
  # Image: pgvector/pgvector ships Postgres 16 + the vector extension preinstalled.
  kb-postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: inter_kb
    ports:
      - "5433:5432"
    volumes:
      - kb_postgres_data:/var/lib/postgresql/data
    # Specify -d inter_kb so the probe connects to the real DB. Without it,
    # pg_isready falls back to db=kb (the username) and Postgres logs a
    # FATAL "database does not exist" on every healthcheck. Functionally
    # harmless, visually alarming.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d inter_kb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql+psycopg://interemailv3:interemailv3@postgres:5432/interemailv3
    command: alembic upgrade head
    volumes:
      - ../../data:/app/data
      - ../../api:/app/api
      - ../../backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://interemailv3:interemailv3@postgres:5432/interemailv3
      - KB_DATABASE_URL=postgresql+psycopg://kb:kb@kb-postgres:5432/inter_kb
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../../data:/app/data
      - ../../api:/app/api
      - ../../backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      kb-postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://interemailv3:interemailv3@postgres:5432/interemailv3
      - KB_DATABASE_URL=postgresql+psycopg://kb:kb@kb-postgres:5432/inter_kb
    command: arq backend.jobs.worker.WorkerSettings
    volumes:
      - ../../data:/app/data
      - ../../api:/app/api
      - ../../backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      kb-postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
    env_file:
      - ../../.env
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  kb_postgres_data:
