[project]
name = "inter-email-v3"
version = "0.1.0"
description = "Inter-Op email workflow V3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  # Required by FastAPI's UploadFile / File() — used by the KB upload route.
  # FastAPI doesn't pull this in automatically; without it the API crashes
  # at import time with "Form data requires python-multipart to be installed".
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic[email]>=2.7.0",
  "python-dotenv>=1.0.1",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13.0",
  "cryptography>=43.0.0",
  "google-api-python-client>=2.170.0",
  "google-auth>=2.29.0",
  "google-auth-oauthlib>=1.2.0",
  # Password hashing — bcrypt directly (passlib 1.7.4 is incompatible with bcrypt>=4).
  "bcrypt>=4.0.0",
  # Microsoft OAuth for Outlook / Microsoft 365.
  "msal>=1.28.0",
  "openai>=1.35.0",
  "anthropic>=0.40.0",
  "arq>=0.25.0",
  # Knowledge Base (RAG) — separate concern, separate DB. Each library
  # owns one extractor; pgvector wires the vector column into SQLAlchemy;
  # tiktoken counts tokens exactly the way OpenAI's embedding model does
  # so our 400/50 chunk budget is real and not a guess.
  "pdfplumber>=0.11.0",
  "python-pptx>=0.6.21",
  "openpyxl>=3.1.0",
  "pgvector>=0.3.0",
  "tiktoken>=0.7.0",
  # Video ingestion pipeline. yt-dlp downloads YouTube audio; scenedetect
  # spots scene changes for targeted frame extraction; opencv decodes
  # frames for OCR; pytesseract reads on-screen text. ffmpeg + tesseract
  # are installed as system binaries via the Dockerfile (not pip).
  "yt-dlp>=2024.04.09",
  "scenedetect[opencv]>=0.6.4",
  "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "debugpy>=1.8.0",
]
postgres = [
  "psycopg[binary]>=3.1.0",
]

[tool.pytest.ini_options]
testpaths = ["api/tests"]

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
